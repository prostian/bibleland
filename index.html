<!doctype html>
<html lang="de" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Färbt die Browserleiste auf dem Handy wie die Kopfleiste der App —
         sonst sitzt über der Oberfläche ein weißer Streifen im Dunkelmodus. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1a" media="(prefers-color-scheme: dark)" />
    <title>Bibleland — Bibel-Atlas, Zeitstrahl &amp; Wissensnetz</title>
    <meta
      name="description"
      content="Die biblische Geschichte als interaktive Karte, Zeitstrahl und Wissensnetz. Ereignisse, Personen, Orte und Reisen chronologisch und geografisch erkunden."
    />
    <!-- Vorschau für geteilte Links. Für die Entitätsseiten schreibt
         scripts/prerender.mjs eigene Angaben an genau diese Stelle; hier
         stehen die der Startseite. -->
    <link rel="canonical" href="https://biblego.info/" />
    <meta property="og:title" content="Bibleland — Bibel-Atlas, Zeitstrahl &amp; Wissensnetz" />
    <meta
      property="og:description"
      content="Die biblische Geschichte als interaktive Karte, Zeitstrahl und Wissensnetz."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://biblego.info/" />
    <meta property="og:site_name" content="Bibleland" />
    <meta property="og:image" content="https://biblego.info/og.png" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <script>
      // Theme vor dem ersten Paint setzen, damit es nicht kurz aufblitzt.
      (function () {
        try {
          var gespeichert = localStorage.getItem('bibleland-theme');
          var dunkel =
            gespeichert === 'dark' ||
            ((!gespeichert || gespeichert === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dunkel);
        } catch (e) {
          /* localStorage kann blockiert sein — dann eben Light Mode. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
