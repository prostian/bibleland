# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/
#
# Angepasst: Deploy Now legt diese Datei ohne Build-Schritt an und laedt das
# Repository unveraendert hoch. Fuer ein Vite-Projekt geht das nicht — die
# index.html verweist auf /src/main.tsx, und TypeScript kann ein statischer
# Server nicht ausliefern. Der Browser blockiert das Modul dann mangels
# MIME-Typ, und die Seite bleibt schwarz.
#
# Deshalb wird hier gebaut und nur noch ./dist hochgeladen.

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  # Nicht das Repository, sondern das Bauergebnis ausliefern.
  DEPLOYMENT_FOLDER: ./dist

jobs:
# Please do not rename this job
  build-project:
    name: build biblego
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          # Vite 8 verlangt Node ^20.19 oder >=22.12. Node 24, weil die
          # Buildskripte reine TypeScript-Module aus src/lib importieren --
          # Node entfernt die Typen dabei selbst, aber erst ab 22.18.
          node-version: '24'
          cache: 'npm'

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typen und Datenbestand pruefen
        # Bricht ab, wenn eine Ereignis-, Orts- oder Personenreferenz ins Leere
        # zeigt. Lieber hier scheitern als eine Seite mit weissen Flecken
        # ausliefern.
        run: npm run check

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build

      - name: Groesse pruefen
        # Nach dem Bauen, weil erst dann die Chunks existieren. Bricht ab,
        # wenn ein Bundle sein Budget reisst -- unbemerkt waechst es sonst,
        # bis die Seite im Mobilfunk nicht mehr laedt.
        run: npm run size

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 5a4adb96-024a-44ed-beaf-f22e5605793a
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/biblego/config.yaml
          action: upload
